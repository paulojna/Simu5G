# RNG Configurations
*.mecHost*.mecPlatform.serviceRegistry.rng-0 = 1 # request service time
*.mecHost*.mecPlatform.serviceRegistry.rng-1 = 2 # subscription service time
*.mecHost*.mecPlatform.mecService[0].rng-0 = 3 # request service time
*.mecHost*.mecPlatform.mecService[0].rng-1 = 4 # subscription service time
# RNIS on dedicated streams — without this it defaults to RNG 0 (shared with the
# channel model), so any difference in RNIS activity between runs or agent modes
# would perturb fading and shift handover timings (simulation artifact, not physics).
# Note: the IDE ini editor may flag rng-N lines as "invalid or custom per-object
# configuration" — cosmetic analyzer quirk (option is registered as "rng-%"); the
# runtime parses these fine, same as the rng lines above.
*.mecHost*.mecPlatform.mecService[1].rng-0 = 5 # request service time
*.mecHost*.mecPlatform.mecService[1].rng-1 = 6 # subscription service time
*.mecHost*.mecPlatform.mecService[*].requestServiceTime = 4us
*.mecHost*.mecPlatform.mecService[*].subscriptionServiceTime = 11us

