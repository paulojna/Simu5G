# ---------------------------- Full Architecture ----------------------------
# Configuration implementing the complete MEC architecture - MEC Apps are instantiated on the MEC Hosts, managed by a MEO.

# App Layer
*.car[*].numApps = 2
*.car[*].app[0].typename = "DeviceApp"
*.car[*].app[0].localPort = 4500
*.car[*].app[0].UALCMPAddress = "ualcmp"
*.car[*].app[0].UALCMPPort = 1000
*.car[*].app[0].appPackageSource = "ApplicationDescriptors/ResponseApp.json"

*.car[*].app[1].typename = "UEPerfApp"
*.car[*].app[1].deviceAppAddress = "car["+string(ancestorIndex(1))+"]"
*.car[*].app[1].deviceAppPort = 4500
*.car[*].app[1].startTime = 10s
*.car[*].app[1].stopTime = 3600s
*.car[*].app[1].period = 0.1s

*.car[*].app[1].controllerAddress = "server"
*.car[*].app[1].controllerPort = 5001

# MEC Orchestrator configuration
*.mecOrchestrator.mecHostList = "mecHost1, mecHost2, mecHost3, mecHost4, mecHost5, mecHost6, mecHost7, mecHost8, mecHost9, mecHost10, mecHost11"              # MEC hosts associated to the MEC system
*.mecOrchestrator.mecApplicationPackageList = "ResponseApp"   # List of MEC app descriptors to be onboarded at
*.mecHost*.mecPlatformManager.mecOrchestrator = "mecOrchestrator" # the MECPM needs to know the MEC orchestrator

# =============================================================================
# eRAVENS TEST CONFIGURATIONS
# Each config runs 300s, single repetition (seed=0 → routes_0).
# All inherit the full network topology from [General].
# Enable selective EV logging for Controller, Agents, and MEO only.
# =============================================================================

[Config Ravens_Test_Base]
sim-time-limit = 300s
repeat = 1
seed-set = 0
warmup-period = 0s

**.server.ravensControllerApp.cmdenv-log-level = detail
**.mecHost*.independentMecApp[0].cmdenv-log-level = detail
*.mecOrchestrator.cmdenv-log-level = detail

# =============================================================================
# PROFILES (meo-plan.md, item 6)
#
# One name per way of running the system. A profile sets *defaults* — every
# axis underneath stays individually overridable in the config that extends
# it, which is what keeps e.g. the learning ablation (predictions on/off,
# everything else identical) a configuration change rather than a code change.
#
# A profile sets only what it means; what follows is derived at startup, not
# written here. Whether Agents send telemetry falls out of who consumes it,
# and whether the Controller calls the model server falls out of the
# orchestrator's strategy — see RavensControllerApp.ned. Each run records what
# it derived (Controller and Agent scalars), so the run's own output proves
# which profile it really was.
#
# All profiles record events: that is what every run is judged by.
# =============================================================================

# Collect the training set — the orchestrator must stay silent.
#
# The only profile that writes users.csv and radio_stats.csv; doing it again
# elsewhere would just duplicate them.
#
# Silence takes two settings, because placement and reaction are separate
# decisions. Every app is created on mecHost11 — the cloud host, whose capacity
# never binds — and RemoveOnExit is the one strategy that never migrates: it
# acts on exits alone, clearing up after users that left the scenario. Leaving
# either at its default would put migrations back into the run, since a
# migration target comes from the event rather than from the selection policy.
#
# None of this changes what is recorded. The Agents observe users through the
# Location and Radio services wherever the apps happen to run, so pinning buys
# a run with no migration machinery in it, not a different training set.
[Config CollectHistory]
*.server.ravensControllerApp.recordEvents = true
*.server.ravensControllerApp.recordTelemetry = true
*.server.ravensControllerApp.predictionServerUrl = ""
*.mecOrchestrator.reactionStrategy = "RemoveOnExit"
*.mecOrchestrator.selectionPolicy = "MecHostBased"
*.mecOrchestrator.mecHostIndex = 10

# Reactive — events only. Nothing here consumes telemetry — no recording, a
# strategy that acts on events alone — so the derivation puts the Agents in
# event-only mode and no telemetry frames are sent: genuinely less signaling
# traffic, a property of this profile worth measuring.
[Config Reactive]
*.server.ravensControllerApp.recordEvents = true
*.server.ravensControllerApp.recordTelemetry = false
*.server.ravensControllerApp.predictionServerUrl = ""
*.mecOrchestrator.reactionStrategy = "MigrateOnChange"
*.mecOrchestrator.selectionPolicy = "LocationBased"

# Proactive — the model drives migrations. The strategy consumes predictions,
# so the derivation turns telemetry on for the model server to predict from.
# It is not written to file: that would be a second copy of what
# CollectHistory already produced, at a row per user per second.
#
# reactiveFallback on: handovers correct the model when it misses one. Stated
# rather than left to the default, because switching it off is the
# no-safety-net variant (see T4).
[Config Proactive]
*.server.ravensControllerApp.recordEvents = true
*.server.ravensControllerApp.recordTelemetry = false
*.server.ravensControllerApp.predictionServerUrl = "http://localhost:5001"
*.mecOrchestrator.reactionStrategy = "MigrateOnPrediction"
*.mecOrchestrator.selectionPolicy = "LocationBased"
*.mecOrchestrator.reactiveFallback = true

# Learning — the policy lives outside the simulation. Each telemetry window the
# orchestrator sends the engine what it knows and carries out the migrations it
# answers with, through the same calls the other strategies use, so the decision
# log and the lifecycle rules are unchanged.
#
# The strategy consumes telemetry, so the derivation puts the Agents in full
# mode. Not written to file, for the same reason Proactive does not: it would
# be a second copy of what CollectHistory already produced.
#
# learningUsesPredictions is the ablation, and the only line that should differ
# between the two learning runs. Off, the agent reads momentum out of the
# samples itself; on, it is told where the model expects each user to go and
# learns whether to believe it. The prediction server URL is set either way —
# the Controller calls it only when the orchestrator says it consumes
# predictions, so the one switch above decides, and the URL sitting unused
# costs nothing.
#
# A run with no engine listening fails at startup rather than quietly doing
# nothing: unlike a missing model server, which degrades a proactive run to
# reactive, a missing engine leaves this strategy with no policy at all.
[Config Learning]
*.server.ravensControllerApp.recordEvents = true
*.server.ravensControllerApp.recordTelemetry = false
*.server.ravensControllerApp.predictionServerUrl = "http://localhost:5001"
*.mecOrchestrator.reactionStrategy = "Learning"
*.mecOrchestrator.selectionPolicy = "LocationBased"
*.mecOrchestrator.learningEngineUrl = "http://localhost:5002"
*.mecOrchestrator.learningUsesPredictions = false

# =============================================================================
# The test runs: a profile plus the run-specific bits — result paths and any
# per-run override. The decisionLogPath points at the same base path as the
# Controller's, so decisions land in the same run directory as the events and
# telemetry they are joined against.
# =============================================================================

[Config T1_CollectTelemetry]
extends = CollectHistory, Ravens_Test_Base
*.server.ravensControllerApp.path = "results/T1_CollectTelemetry/"
*.mecOrchestrator.decisionLogPath = "results/T1_CollectTelemetry/"

[Config T2_Reactive]
extends = Reactive, Ravens_Test_Base
*.server.ravensControllerApp.path = "results/T2_Reactive/"
*.mecOrchestrator.decisionLogPath = "results/T2_Reactive/"

[Config T3_Proactive]
extends = Proactive, Ravens_Test_Base
*.server.ravensControllerApp.path = "results/T3_Proactive/"
*.mecOrchestrator.decisionLogPath = "results/T3_Proactive/"

# --- T4: proactive with no safety net — what the model is worth alone ---
#
# T3 in every respect but one: a confirmed handover is recorded and not acted on,
# so nothing moves an application except a prediction. T3 measures predictions
# with a reactive net under them, which is the sensible way to run the system;
# this measures the predictions, which is what the model is judged by. Handovers
# the model missed are rows in this run's decision log — trigger ConfirmedEvent,
# kind None — and counting them needs no comparison against T3 at all.
[Config T4_ProactiveNoFallback]
extends = T3_Proactive
*.server.ravensControllerApp.path = "results/T4_ProactiveNoFallback/"
*.mecOrchestrator.decisionLogPath = "results/T4_ProactiveNoFallback/"
*.mecOrchestrator.reactiveFallback = false

# --- T5: learning, no prediction stream — the ablation's control arm ---
#
# Needs an engine answering at learningEngineUrl; without one the run stops at
# startup. Nothing else about the run is special: the same events, the same
# telemetry, the same decision log.
[Config T5_Learning]
extends = Learning, Ravens_Test_Base
*.server.ravensControllerApp.path = "results/T5_Learning/"
*.mecOrchestrator.decisionLogPath = "results/T5_Learning/"

# --- T6: learning with predictions in the observation ---
#
# T5 in every respect but one line, which is the point: the ablation is the
# prediction stream and nothing else. Whether the agent acts on a prediction or
# waits for the confirmed handover is then readable straight off the decision
# log, per user and per step, rather than only as an aggregate.
[Config T6_LearningWithPredictions]
extends = T5_Learning
*.server.ravensControllerApp.path = "results/T6_LearningWithPredictions/"
*.mecOrchestrator.decisionLogPath = "results/T6_LearningWithPredictions/"
*.mecOrchestrator.learningUsesPredictions = true

# =============================================================================
# PRODUCTION
# The full hour. The routes cover it — vehicles keep arriving to ~4870s and
# SUMO's own end time is 3600 — so traffic is continuous for the whole run.
# -r N selects seed-set N and its routes_N / launchd files; repeat bounds N.
# Express mode and quiet logging are the [General] defaults — deliberately not
# extending Ravens_Test_Base, whose 300s limit and detail logging are
# test-only.
# =============================================================================
[Config Production_Base]
sim-time-limit = 3600s
repeat = 30
seed-set = ${repetition}
warmup-period = 0s

[Config P1_CollectHistory]
extends = CollectHistory, Production_Base
repeat = 120
seed-set = ${repetition}
*.server.ravensControllerApp.path = "results/P1_CollectHistory/"
*.mecOrchestrator.decisionLogPath = "results/P1_CollectHistory/"

[Config P2_Reactive]
extends = Reactive, Production_Base
*.server.ravensControllerApp.path = "results/P2_Reactive/"
*.mecOrchestrator.decisionLogPath = "results/P2_Reactive/"

[Config P3_Proactive]
extends = Proactive, Production_Base
*.server.ravensControllerApp.path = "results/P3_Proactive/"
*.mecOrchestrator.decisionLogPath = "results/P3_Proactive/"

[Config P4_ProactiveNoFallback]
extends = P3_Proactive
*.server.ravensControllerApp.path = "results/P4_ProactiveNoFallback/"
*.mecOrchestrator.decisionLogPath = "results/P4_ProactiveNoFallback/"
*.mecOrchestrator.reactiveFallback = false
