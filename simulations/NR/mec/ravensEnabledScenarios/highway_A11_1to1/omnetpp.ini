**.cmdenv-log-level = off

#print-undisposed = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.vec

repeat = 50
seed-set = ${repetition}
num-rngs = 7
#**.sctp.**.scalar-recording = false  # remove annoying statistics from SCTP
#**.sctp.**.vector-recording = false  # remove annoying statistics from SCTP

**.car[*].app[1].**.vector-recording = true
**.vim.*.vector-recording = true
**.car[*].app[1].**.scalar-recording = true
**.servingCell*.vector-recording = true
# RAVENS agents (mecHost*.independentMecApp[0]): telemetry frame counts, including
# how many frames grew past the path MTU and had to be split up. Must stay above
# the blanket false below — first matching pattern wins.
**.independentMecApp[*].scalar-recording = true
# The Controller and the orchestrator record what they derived and what they
# actually did — which profile was really in force, how much of an oracle trace
# was replayed, how many predictions arrived too late. Without these a run cannot
# be checked against what it was meant to be.
*.server.ravensControllerApp.scalar-recording = true
*.mecOrchestrator.scalar-recording = true
**.vector-recording = false
**.scalar-recording = false

############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2**.sctp.enableHeartbeats = false

# Size of the simulation area — matches the SUMO net convBoundary (9215.09 x 6408.06)
**.playgroundSizeX = 9215.08m
**.playgroundSizeY = 6408.06m
**.playgroundSizeZ = 0m

# Network
network = simu5g.simulations.NR.mec.ravensEnabledScenarios.highway_A11_1to1.highwayA11_1to1_v2
**.hasRNISupport = true

# General PHY parameters
**.downlink_interference = true
**.uplink_interference = true
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm
**.targetBler = 0.01
**.blerShift = 5
**.fbPeriod = 100tti   # CQI reporting period

**.nodeb_height = 23m
**.ue_height = 1m
**.bs_noise_figure = 5dBm
**.cable_loss = 2dB
**.antennGainEnB = 17dBi
**.fixed_los = true

# manual_config_v2.xml, not manual_config.xml: the latter is an auto-generated
# dump that routes backhaul over the radio interfaces and loops for anything
# addressed to mecHost7. See network_topology_helper.md.
# With every add*Routes switch false, the XML *is* the routing table — nothing
# corrects it at runtime.
*.configurator.config = xmldoc("manual_config_v2.xml")
*.configurator.optimizeRoutes  = false
*.configurator.addStaticRoutes = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes = false
#*.configurator.dumpConfig = "manual_config.xml"

# tcp settings
**.tcp.typename = "Tcp"
**.tcp.advertisedWindow = 65535         # in bytes, corresponds with the maximal receiver buffer capacity (Note: normally, NIC queues should be at least this size)
**.tcp.tcpAlgorithmClass = "TcpReno"    # TcpReno/TcpTahoe/TcpNewReno/TcpNoCongestionControl/DumbTcp
**.tcp.sackSupport = true               # Selective Acknowledgment (RFC 2018, 2883, 3517) support (header option) (SACK will be enabled for a connection if both endpoints support it)

warmup-period = 0s
sim-time-limit = 3600s

# VeinsManager parameters
#
# One launch config, unlike tust_1to1 which selects a per-repetition file. There
# is a single route file here and SUMO's own seed supplies the variation: the
# launchd.xml carries no <seed> element and veinsManager.seed defaults to -1, so
# TraCIScenarioManagerLaunchd injects the *run number* and veins_launchd writes
# it into the sumocfg it hands SUMO. Repetitions therefore differ in speedFactor
# draws, lane choice and car-following noise.
#
# That equivalence holds only while every iteration variable below has exactly
# one value, which keeps run number == repetition. Give one of them a second
# value and SUMO's seed stops tracking seed-set.
*.veinsManager.host = "localhost"
*.veinsManager.moduleType = "simu5g.nodes.cars.NRCar"
*.veinsManager.moduleName = "car"
*.veinsManager.launchConfig = xmldoc("highwayA11_1to1.launchd.xml")
*.veinsManager.updateInterval = 1s

# Mobility parameters
*.car[*].mobility.typename = "VeinsInetMobility"
*.car[*].masterId = 0     # ignored if dynamic association is disabled
*.car[*].macCellId = 0    # ignored if dynamic association is disabled
*.car[*].nrMasterId = 1     # ignored if dynamic association is disabled
*.car[*].nrMacCellId = 1    # ignored if dynamic association is disabled

# Pinned so cell ids are stable across runs. The oracle replays a trace of cell
# transitions recorded in a different run; if ids were assigned by module order
# they could shift and the trace would describe the wrong cells.
*.gnb1.macCellId = 1
*.gnb1.macNodeId = 1
*.gnb2.macCellId = 2
*.gnb2.macNodeId = 2
*.gnb3.macCellId = 3
*.gnb3.macNodeId = 3
*.gnb4.macCellId = 4
*.gnb4.macNodeId = 4
*.gnb5.macCellId = 5
*.gnb5.macNodeId = 5
*.gnb6.macCellId = 6
*.gnb6.macNodeId = 6

# Motorway, not city streets — this is the one PHY choice that must differ from
# tust_1to1. tolerateMaxDistViolation stays true: the playground is ~11 km across
# and every gNB computes pathloss to every UE for interference, so pairs well
# beyond the model's max distance are routine here (in tust nothing is more than
# ~1.8 km apart, so it can afford to be strict).
**.scenario = "RURAL_MACROCELL"
**.tolerateMaxDistViolation = true

# Single carrier at 2 GHz. tust_1to1 uses 6 GHz, which is wrong here: the base
# stations are ~2 km apart along the road and 6 GHz would not reach.
# 100 RBs as in tust — at ~27 concurrent cars per cell, 50 would make the radio
# the bottleneck and bury the MEC effects being measured.
**.cellularNic.LteChannelModelType = "NRChannelModel_3GPP38_901"

*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 100

*.gnb*.cellularNic.numCarriers = 1
*.gnb*.cellularNic.channelModel[0].componentCarrierIndex = 0

*.car[*].cellularNic.numNRCarriers = 1
*.car[*].cellularNic.nrChannelModel[0].componentCarrierIndex = 0

# X2 Configurations
#
# A chain, gnb1 <-> gnb2 <-> ... <-> gnb6, so the two ends have one peer and the
# rest have two. (tust_1to1 is a mesh with up to six.)
*.gnb1.numX2Apps = 1
*.gnb2.numX2Apps = 2
*.gnb3.numX2Apps = 2
*.gnb4.numX2Apps = 2
*.gnb5.numX2Apps = 2
*.gnb6.numX2Apps = 1

# one x2App per peering node
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)  # Server ports (x2App[0]=5000, x2App[1]=5001, ...)

# Each address must name the peer's interface *on the shared link*. Going "up"
# the chain that is the peer's x2ppp0; going "down" it is its x2ppp1 (except
# gnb1, which only has x2ppp0). Naming x2ppp0 in both directions still resolves
# — but via the core: gnb3 -> iUpf3 -> core_router -> iUpf1 -> gnb1 -> gnb2,
# five hops instead of one, which would inflate handover signalling latency.
# NOTE: tust_1to1 names x2ppp0 in both directions and has this detour.
*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"

*.gnb2.x2App[1].client.connectAddress = "gnb3%x2ppp0"
*.gnb3.x2App[0].client.connectAddress = "gnb2%x2ppp1"

*.gnb3.x2App[1].client.connectAddress = "gnb4%x2ppp0"
*.gnb4.x2App[0].client.connectAddress = "gnb3%x2ppp1"

*.gnb4.x2App[1].client.connectAddress = "gnb5%x2ppp0"
*.gnb5.x2App[0].client.connectAddress = "gnb4%x2ppp1"

*.gnb5.x2App[1].client.connectAddress = "gnb6%x2ppp0"
*.gnb6.x2App[0].client.connectAddress = "gnb5%x2ppp1"

**.dynamicCellAssociation = true
**.enableHandover = true

# MEC Configurations
#
# mecHost7 is the cloud fallback — the counterpart of mecHost11 in tust_1to1.
# Its capacity never binds, which is what lets CollectHistory pin every app to it.
# These lines must stay ABOVE the mecHost* wildcard: first match wins.
**.mecHost7.virtualisationInfrastructure.ipv4.forwarding = true
*.mecHost7.maxMECApps = 20000					# max ME Apps to instantiate
*.mecHost7.maxRam = 1000TB					# max KBytes of Ram
*.mecHost7.maxDisk = 1000TB					# max KBytes of Disk Space
*.mecHost7.maxCpuSpeed = 10000000

# Edge MEC Hosts
#
# maxCpuSpeed is a budget the VIM draws down by each app's virtualCpu from its
# descriptor (avRes.cpu = maxCPU - allocatedCPU). ApplicationDescriptors/
# ResponseApp.json asks for 500, and the RAVENS agent on each host takes 10000,
# so 150000 leaves room for ~280 apps — maxMECApps caps it at 250 first. Traffic
# here peaks around 27 concurrent apps per host, so neither limit binds.
# (ResponseApp.json used to ask for 70000, which allowed 2 apps per host.)
**.mecHost*.virtualisationInfrastructure.ipv4.forwarding = true
*.mecHost*.maxMECApps = 250					# max ME Apps to instantiate
*.mecHost*.maxRam = 16GB					# max KBytes of Ram
*.mecHost*.maxDisk = 10TB					# max KBytes of Disk Space
*.mecHost*.maxCpuSpeed = 150000	            # max CPU

*.mecHost*.vim.scheduling = ${"fair"}

*.mecHost1.bsList = "gnb1"
*.mecHost2.bsList = "gnb2"
*.mecHost3.bsList = "gnb3"
*.mecHost4.bsList = "gnb4"
*.mecHost5.bsList = "gnb5"
*.mecHost6.bsList = "gnb6"

*.gnb*.gateway = "upf"
*.iUpf*.gateway = "upf"

*.router.ipv4.forwarding = true
*.core_router.ipv4.forwarding = true

# RAVENS Controller Configurations
*.server.numApps = 1
# (typename line removed — ravensControllerApp is a fixed-type submodule of
# RavensController.ned; note the submodule name: server.ravensControllerApp,
# NOT server.app[0] — the old app[0] patterns silently matched nothing and the
# controller ran on NED defaults for months)
*.server.ravensControllerApp.dataPort = 5001
*.server.ravensControllerApp.mgmtPort = 5000
# What is recorded, and where the model server lives. Whether the Agents send
# telemetry at all is set nowhere: the Controller derives it from these plus
# what the orchestrator's strategy consumes — see RavensControllerApp.ned.
*.server.ravensControllerApp.recordEvents = true         # lifecycle.csv — what happened
*.server.ravensControllerApp.recordTelemetry = true      # users.csv + radio_stats.csv — training data
*.server.ravensControllerApp.predictionServerUrl = ""    # empty = no model server
*.server.ravensControllerApp.path = "results/"

*.server.ravensControllerApp.telemetryInterval = 1       # how often Agents send telemetry (s)
*.server.ravensControllerApp.exitConfirmationWindow = 3  # wait before declaring a UE gone (s)
*.server.ravensControllerApp.silenceWarningThreshold = 60  # diagnostic only; >> telemetryInterval
# telemetryWindow defaults to telemetryInterval, which is what you want: it is
# exactly one round of frames. There is no other periodic report — confirmed
# events and predictions go to the orchestrator the moment they exist.

